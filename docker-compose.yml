version: '3.8'

services:
  backend:
    container_name: backend
    build:
      context: backend
      dockerfile: Dockerfile
    image: hearth-backend
    #ports:
    #  - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
      - ./data/.config/hearth:/root/.config/hearth
      - ./data/.local/share/hearth:/root/.local/share/hearth
    environment:
      - CGO_ENABLED=0
      - HEARTH_DEBUG_INFERENCE=1
    networks:
      - dev-network

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    image: hearth-frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - dev-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/development.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - dev-network

  likec4:
    image: likec4/likec4
    container_name: likec4
    profiles:
      - docs
    init: true
    command: start --host 0.0.0.0
    # Containerized file-watching needs polling to pick up edits on the mount.
    environment:
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=200
    ports:
      - "8081:5173"   # viewer
      - "24678:24678" # hot-reload (HMR)
    volumes:
      - ./docs/architecture:/data
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  frontend_node_modules:
