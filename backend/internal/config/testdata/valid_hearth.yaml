listen: ":8080"

providers:
  - name: anthropic
    protocol: anthropic
    base_url: https://api.anthropic.com
    api_key: "${ANTHROPIC_API_KEY}"

  - name: ollama
    protocol: openai_compatible
    base_url: http://ollama-docker-container-name:11434
    tool_mode: xml

models:
  claude-sonnet-4.6:
    provider: anthropic
    provider_model: claude-sonnet-4-20250514
  gemma-4-local:
    provider: ollama
    provider_model: gemma3:12b

tools:
  max_tool_iterations: 10
  default_clearance: 5
  webfetch:
    clearance: 1
  brave_search:
    api_key: "${BRAVE_API_KEY}"
    clearance: 1
  servers:
    - name: email
      url: "https://example.com/mcp"
      clearance: 2

# Reusable grant bundles agents reference by name. A deny in a set vetoes; an
# allow grants. Sets hold statements, not references to other sets.
permission_sets:
  web-tools:
    - tool:invoke/frsn:tool/builtin/webfetch
    - tool:invoke/frsn:tool/builtin/web_search
  untrusted:
    - tool:invoke/frsn:tool/builtin/create_room:deny

# Resource-scoped restrictions: a matching deny or require_confirmation tightens
# a call regardless of the agent's grants; they never grant on their own.
resource_policies:
  - tool:invoke/frsn:tool/builtin/create_room:require_confirmation
